name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        # uses go.mod's go directive, so CI always matches go.mod
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  # Report known module/GO vulnerabilities before someone finds them in a scan.
  # Non-blocking: rsc.io/pdf GO-2026-5781 has no fixed version, so a failing
  # job would just block every merge. Findings stay visible in the step log.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run govulncheck
      continue-on-error: true
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The release image is only built on tag, so a broken Containerfile or a
  # runtime-incompatible base image would otherwise ship untested.
  container:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -f Containerfile -t dir2opds:ci .

    - name: Smoke test
      run: |
        mkdir -p "$RUNNER_TEMP/books"
        docker run -d --name ci -p 8080:8080 -v "$RUNNER_TEMP/books:/books" dir2opds:ci
        for i in $(seq 1 20); do
          if curl -fsS http://localhost:8080/health; then exit 0; fi
          sleep 1
        done
        docker logs ci
        exit 1
